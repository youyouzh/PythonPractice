[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pylint==2.15.10",
    "pytest~=7.2",
    "pytest-asyncio==0.21.0",
    "pytest-cov~=5.0",
    "pytest-dotenv==0.5.2",
    "pytest-mock==3.11.1",
    "types-PyYAML>=6.0.12.12,<7",
    "types-requests>=2.28.11.8",
]

[project]
name = "practice"
version = "1.0.0"
description = "Python Spiders, Tools by uusama"
authors = [{name = "uusama", email = ""}]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
maintainers = [
    {name = "uusama", email = ""},
]
keywords = ["Spider", "Tool"]
dependencies = [
    "SQLAlchemy",
    "pymysql",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pillow",
    "cloudscraper",
    "pycryptodome",
    "xmltodict",
    "pywin32",
]

[project.urls]
Homepage = "https://github.com/youyouzh/PythonPractice"
Repository = "https://github.com/youyouzh/PythonPractice"
Documentation = "https://github.com/youyouzh/PythonPractice"

[tool.codespell]
check-filenames = true
check-hidden = true
ignore-words-list = "astroid,gallary,momento,narl,ot,rouge"
# Feel free to un-skip examples, and experimental, you will just need to
# work through many typos (--write-changes and --interactive will help)
skip = "./examples,./experimental,*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb"

[tool.coverage.run]
omit = [
    "test/*",
]

[tool.mypy]
disallow_untyped_defs = true
# Remove venv skip when integrated with pre-commit
exclude = ["_static", "build", "examples", "notebooks", "venv"]
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
plugins = "pydantic.mypy"
python_version = "3.10"

[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2  # Match Python PEP 8
spaces_indent_inline_array = 4  # Match Python PEP 8
trailing_comma_inline_array = true

[tool.tomlsort.overrides."tool.poetry.dependencies"]
table_keys = false

[tool.uv]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
explicit = true
